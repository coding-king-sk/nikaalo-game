name: Build APK & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/nikaalo-build-${{ github.run_number }}.apk"
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nikaalo-apk
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Nikaalo ${{ steps.apk.outputs.tag }}
          body: |
            ## Nikaalo — build ${{ github.run_number }}

            Traffic jam puzzle game. APK neeche attached hai — download karke install karo.

            **Is build me:**
            - 12 playable levels (3 chapters)
            - Drag-to-slide board with snap-to-grid
            - BFS solver based hints (optimal next move)
            - Undo / Restart, star rating, progress save

            > Note: ye debug-signed build hai. Play Store ke liye release signing CI secrets ke saath add karni hogi.
          files: dist/*.apk
          draft: false
          prerelease: false
